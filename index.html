<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNIVhub | Premium Scripts</title>
    <style>
        /* Setări de bază pentru mobil */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #050505; color: #fff; min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column; }
        
        /* Efect de fundal (Glow) */
        .glow-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at 50% 0%, rgba(0, 200, 255, 0.15) 0%, transparent 60%); z-index: -1; pointer-events: none; }

        /* Header */
        header { text-align: center; padding: 40px 20px 20px 20px; }
        h1 { font-size: 2.8rem; font-weight: 800; letter-spacing: 1px; margin-bottom: 5px; }
        h1 span { color: #00c8ff; text-shadow: 0 0 15px rgba(0, 200, 255, 0.6); }
        p.subtitle { color: #888; font-size: 1rem; margin-bottom: 20px; }
        
        /* Banner Discord */
        .discord-btn { display: inline-flex; align-items: center; justify-content: center; background-color: #5865F2; color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 1rem; transition: 0.3s; box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4); border: 1px solid #4752C4; }
        .discord-btn:active { transform: scale(0.95); }
        .discord-btn img { width: 20px; margin-right: 10px; }

        /* Containerul pentru Scripturi */
        .container { padding: 20px; display: flex; flex-direction: column; gap: 15px; max-width: 600px; margin: 0 auto; width: 100%; }

        /* Cardul de Script (Design Premium) */
        .card { background: linear-gradient(145deg, #101010, #181818); border: 1px solid #2a2a2a; border-radius: 16px; padding: 20px; position: relative; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #00c8ff; border-radius: 4px 0 0 4px; }
        
        /* Tag-uri */
        .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .tag { background-color: #222; color: #aaa; font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; border: 1px solid #333; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .tag.premium { background: linear-gradient(45deg, #ff00cc, #3333ff); color: #fff; border: none; box-shadow: 0 0 10px rgba(255, 0, 204, 0.4); }
        
        /* Titlu Script */
        h2 { font-size: 1.4rem; margin-bottom: 5px; color: #fff; }
        .game { color: #888; font-size: 0.9rem; margin-bottom: 20px; display: flex; align-items: center; }
        .game::before { content: '🎮'; margin-right: 5px; }

        /* Butonul de Copy (Mare pentru mobil) */
        .copy-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 15px; background-color: #1a1a1a; color: #fff; border: 2px solid #333; border-radius: 12px; font-size: 1rem; font-weight: 700; transition: 0.2s; cursor: pointer; }
        .copy-btn:active { background-color: #00c8ff; color: #000; border-color: #00c8ff; transform: scale(0.98); }
        
        /* Starea de succes */
        .copy-btn.success { background-color: #00ff88; color: #000; border-color: #00ff88; }

        /* Footer */
        footer { text-align: center; padding: 30px; color: #555; font-size: 0.8rem; margin-top: auto; }
    </style>
</head>
<body>

    <div class="glow-bg"></div>

    <header>
        <h1>UNIV<span>hub</span></h1>
        <p class="subtitle">The Ultimate Roblox Script Hub</p>
        <a href="https://discord.gg/QN9yTgzJNQ" class="discord-btn" target="_blank">
            Join Discord
        </a>
    </header>

    <div class="container" id="scripts-container">
        <!-- Scripturile vor fi injectate aici de JavaScript -->
    </div>

    <footer>
        <p>© 2026 UNIVhub | Made by @avongg6 & @Og.gg</p>
    </footer>

    <script>
        // AICI PUI SCRIPTURILE TALE
        const scripts = [
            {
                name: "UNIVhub",
                game: "Universal (All Games)",
                tags: ["Aimbot", "ESP", "Fly", "Premium"],
                isPremium: true,
                // AICI PUI LINK-UL DE LA GITHUB CAND E GATA SCRIPTUL
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/filip-prog/HussHubV2/main/UNIVhub.lua"))()'
            },
            {
                name: "PrimeHUB",
                game: "Prison Life",
                tags: ["Silent Aim", "ESP", "Gun Mod"],
                isPremium: false,
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/filip-prog/fuzzy-octo-train/main/main.lua"))()'
            },
            {
                name: "MoneyHUB",
                game: "Steal An Egg",
                tags: ["Pet Spawner", "Auto Money"],
                isPremium: false,
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/filip-prog/Steal-a-egg/main/main.lua"))()'
            }
        ];

        const container = document.getElementById('scripts-container');

        // Generăm cardurile
        scripts.forEach((script, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            // Generăm tag-urile
            let tagsHTML = '';
            script.tags.forEach(tag => {
                tagsHTML += `<span class="tag ${script.isPremium ? 'premium' : ''}">${tag}</span>`;
            });

            // Construim HTML-ul
            card.innerHTML = `
                <div class="tags">${tagsHTML}</div>
                <h2>${script.name}</h2>
                <div class="game">${script.game}</div>
                <button class="copy-btn" id="btn-${index}">📋 Copy Script</button>
            `;

            container.appendChild(card);

            // Adăugăm acțiunea pentru buton
            const btn = document.getElementById(`btn-${index}`);
            btn.addEventListener('click', () => {
                navigator.clipboard.writeText(script.code).then(() => {
                    btn.textContent = "✅ Copied!";
                    btn.classList.add('success');
                    
                    setTimeout(() => {
                        btn.textContent = "📋 Copy Script";
                        btn.classList.remove('success');
                    }, 2000);
                }).catch(err => {
                    alert("Eroare la copiere. Incearca din nou.");
                });
            });
        });
    </script>
</body>
</html>
