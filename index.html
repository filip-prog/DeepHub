<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeepHub | Roblox Scripts</title>
    <style>
        /* CULORI: NEGRU ȘI MOV */
        :root {
            --bg-main: #0a0a0c;
            --bg-card: #131316;
            --bg-hover: #1e1e24;
            --accent: #9d4edd; /* Movul principal */
            --accent-glow: rgba(157, 78, 221, 0.4);
            --text-main: #ffffff;
            --text-muted: #888891;
            --border: #27272e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; overflow-x: hidden; padding-bottom: 50px; }

        /* HEADER */
        header { padding: 15px 20px; display: flex; flex-direction: column; gap: 15px; position: sticky; top: 0; background: var(--bg-main); z-index: 100; border-bottom: 1px solid var(--border); }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 22px; font-weight: 900; letter-spacing: 0.5px; }
        .logo span { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }
        
        .discord-btn { background: var(--accent); color: white; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; box-shadow: 0 0 15px var(--accent-glow); }
        .discord-btn:active { transform: scale(0.95); }

        .search-bar { display: flex; align-items: center; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 15px; }
        .search-bar input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 15px; }
        .search-bar input::placeholder { color: var(--text-muted); }

        /* MENIU ORIZONTAL (Ca pe rblxscripts) */
        .nav-menu { display: flex; overflow-x: auto; gap: 10px; padding: 15px 20px; scrollbar-width: none; border-bottom: 1px solid var(--border); }
        .nav-menu::-webkit-scrollbar { display: none; }
        .nav-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; transition: 0.2s; }
        .nav-btn.active { background: var(--accent); border-color: var(--accent); color: white; box-shadow: 0 0 10px var(--accent-glow); }

        /* TITLU SECȚIUNE */
        .section-header { padding: 20px 20px 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        .section-header h2 { font-size: 18px; font-weight: 800; }
        .section-header span { font-size: 12px; color: var(--text-muted); font-weight: 600; }

        /* CONTAINER CARDURI (Listă verticală pe mobil, Grid pe PC) */
        .grid-container { padding: 0 20px; display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 900px; margin: 0 auto; }
        @media (min-width: 768px) { .grid-container { grid-template-columns: 1fr 1fr; } }

        /* CARD SCRIPT */
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; transition: 0.2s; position: relative; overflow: hidden; }
        .card:active { border-color: var(--accent); transform: scale(0.98); }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: var(--accent); opacity: 0.8; }

        /* TAG-URI */
        .tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .tag { font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .tag.key { background: rgba(157, 78, 221, 0.2); color: #c084fc; border: 1px solid rgba(157, 78, 221, 0.4); }
        .tag.mobile { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .tag.premium { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        /* INFO CARD */
        .card-info { display: flex; flex-direction: column; gap: 4px; }
        .card-game { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
        .card-title { font-size: 16px; font-weight: 700; line-height: 1.3; color: white; }

        /* FOOTER CARD */
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
        .views { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; font-weight: 600; }
        
        .copy-btn { background: #1c1c22; color: white; border: 1px solid var(--border); padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; transition: 0.2s; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .copy-btn:active { background: var(--accent); border-color: var(--accent); }
        .copy-btn.success { background: #10b981; border-color: #10b981; }
    </style>
</head>
<body>

    <header>
        <div class="top-bar">
            <div class="logo">Deep<span>Hub</span></div>
            <a href="https://discord.gg/QN9yTgzJNQ" class="discord-btn" target="_blank">Discord</a>
        </div>
        <div class="search-bar">
            <span style="margin-right: 10px; color: var(--text-muted);">🔍</span>
            <input type="text" id="searchInput" placeholder="Search scripts or games...">
        </div>
    </header>

    <!-- Meniu orizontal -->
    <div class="nav-menu">
        <button class="nav-btn active" onclick="filterScripts('Newest', this)">Newest</button>
        <button class="nav-btn" onclick="filterScripts('Trending', this)">Trending</button>
        <button class="nav-btn" onclick="filterScripts('Recommended', this)">Recommended</button>
        <button class="nav-btn" onclick="filterScripts('Mobile Friendly', this)">Mobile Friendly</button>
        <button class="nav-btn" onclick="filterScripts('Key System', this)">Key System</button>
    </div>

    <div class="section-header">
        <h2 id="sectionTitle">Newest</h2>
        <span>Updated Daily</span>
    </div>

    <div class="grid-container" id="scripts-container">
        <!-- Cardurile se injectează aici -->
    </div>

    <script>
        // BAZA DE DATE CU SCRIPTURI
        const scriptsData = [
            {
                id: 1,
                name: "UNIVhub | Aimbot, ESP, Fly",
                game: "Universal",
                tags: ["Premium", "Mobile Friendly", "Key System"],
                views: "2.4K",
                category: "Newest",
                loadstring: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/filip-prog/HussHubV2/main/UNIVhub.lua"))()'
            },
            {
                id: 2,
                name: "PrimeHUB | Silent Aim & Mods",
                game: "Prison Life",
                tags: ["Key System", "Mobile Friendly"],
                views: "1.8K",
                category: "Trending",
                loadstring: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/filip-prog/fuzzy-octo-train/main/main.lua"))()'
            },
            {
                id: 3,
                name: "MoneyHUB | Auto Farm & Pets",
                game: "Steal An Egg",
                tags: ["Mobile Friendly", "Premium"],
                views: "5.1K",
                category: "Recommended",
                loadstring: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/filip-prog/Steal-a-egg/main/main.lua"))()'
            }
        ];

        const container = document.getElementById('scripts-container');
        const searchInput = document.getElementById('searchInput');
        const sectionTitle = document.getElementById('sectionTitle');

        // Funcție pentru randarea cardurilor
        function renderCards(scripts, categoryName) {
            container.innerHTML = '';
            sectionTitle.textContent = categoryName || 'All Scripts';

            if (scripts.length === 0) {
                container.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 20px;">No scripts found.</p>';
                return;
            }

            scripts.forEach((script, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                
                let tagsHTML = '';
                script.tags.forEach(tag => {
                    let tagClass = 'tag';
                    if (tag === 'Key System') tagClass += ' key';
                    if (tag === 'Mobile Friendly') tagClass += ' mobile';
                    if (tag === 'Premium') tagClass += ' premium';
                    tagsHTML += `<span class="${tagClass}">${tag}</span>`;
                });

                card.innerHTML = `
                    <div class="tags">${tagsHTML}</div>
                    <div class="card-info">
                        <div class="card-game">${script.game}</div>
                        <div class="card-title">${script.name}</div>
                    </div>
                    <div class="card-footer">
                        <div class="views">👁️ ${script.views} views</div>
                        <button class="copy-btn" id="btn-${script.id}">📋 Copy Script</button>
                    </div>
                `;
                container.appendChild(card);

                // Adăugăm acțiunea pentru buton
                const btn = document.getElementById(`btn-${script.id}`);
                btn.addEventListener('click', () => {
                    navigator.clipboard.writeText(script.loadstring).then(() => {
                        btn.textContent = "✅ Copied!";
                        btn.classList.add('success');
                        setTimeout(() => {
                            btn.textContent = "📋 Copy Script";
                            btn.classList.remove('success');
                        }, 2000);
                    });
                });
            });
        }

        // Inițial afișăm toate scripturile
        renderCards(scriptsData, "Newest");

        // Funcție pentru filtrare pe categorii
        function filterScripts(category, btn) {
            // Schimbă butonul activ
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if (category === 'Newest') {
                renderCards(scriptsData, "Newest");
            } else {
                // Filtrăm după tag-uri
                const filtered = scriptsData.filter(s => s.tags.includes(category) || s.category === category);
                renderCards(filtered, category);
            }
        }

        // Funcție pentru căutare
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = scriptsData.filter(s => 
                s.name.toLowerCase().includes(query) || 
                s.game.toLowerCase().includes(query)
            );
            renderCards(filtered, "Search Results");
        });
    </script>
</body>
</html>
