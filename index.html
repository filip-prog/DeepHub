<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepHub | Premium Scripts</title>
    <style>
        /* Culori: Negru și Mov */
        :root {
            --bg-main: #0a0a0c;
            --bg-card: #121216;
            --bg-hover: #1a1a22;
            --accent: #8b5cf6; /* Movul principal */
            --accent-glow: rgba(139, 92, 246, 0.4);
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --border: #2a2a35;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

        /* Header & Search */
        header { padding: 20px; display: flex; flex-direction: column; gap: 15px; position: sticky; top: 0; background: var(--bg-main); z-index: 100; border-bottom: 1px solid var(--border); }
        
        .logo-area { display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 24px; font-weight: 800; letter-spacing: 1px; }
        .logo span { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }
        
        .discord-btn { background: var(--accent); color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; box-shadow: 0 0 15px var(--accent-glow); transition: 0.2s; }
        .discord-btn:active { transform: scale(0.95); }

        .search-bar { display: flex; align-items: center; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 15px; }
        .search-bar input { background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 15px; }
        .search-bar input::placeholder { color: var(--text-muted); }

        /* Layout Secțiuni */
        .section-title { padding: 20px 20px 10px 20px; font-size: 18px; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .section-title span { font-size: 12px; color: var(--text-muted); font-weight: 500; }

        /* Grid-ul de Carduri (ca pe rblxscripts) */
        .container { padding: 0 20px 20px 20px; display: grid; grid-template-columns: 1fr; gap: 15px; max-width: 800px; margin: 0 auto; }

        /* Cardul de Script */
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 15px; display: flex; flex-direction: column; gap: 12px; transition: 0.2s; position: relative; overflow: hidden; }
        .card:active { background: var(--bg-hover); border-color: var(--accent); }
        
        /* Linia mov de sus */
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: var(--accent); opacity: 0.8; }

        /* Header-ul Cardului (Tag-uri) */
        .card-header { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
        .tag { font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .tag.key { background: rgba(139, 92, 246, 0.2); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); }
        .tag.mobile { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .tag.premium { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        /* Titlu Card */
        .card h3 { font-size: 16px; font-weight: 600; line-height: 1.3; color: white; }
        .card h3 span { color: var(--text-muted); font-weight: 400; font-size: 14px; display: block; margin-bottom: 2px;}

        /* Footer-ul Cardului (Buton + Views) */
        .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
        .views { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
        
        .copy-btn { background: #1f1f27; color: white; border: 1px solid var(--border); padding: 10px 15px; border-radius: 8px; font-size: 13px; font-weight: 600; transition: 0.2s; cursor: pointer; display: flex; align-items: center; gap: 5px;}
        .copy-btn:active { background: var(--accent); border-color: var(--accent); transform: scale(0.95); }
        .copy-btn.success { background: #10b981; border-color: #10b981; }

        /* Ascunde scrollbar-ul orizontal pe mobil */
        ::-webkit-scrollbar { width: 0; height: 0; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo">Deep<span>Hub</span></div>
            <a href="https://discord.gg/QN9yTgzJNQ" class="discord-btn">Discord</a>
        </div>
        <div class="search-bar">
            <span style="margin-right: 10px; color: var(--text-muted);">🔍</span>
            <input type="text" placeholder="Search scripts or games...">
        </div>
    </header>

    <div class="section-title">
        Newest <span>Updated Daily</span>
    </div>

    <div class="container" id="scripts-container">
        <!-- Scripturile vor fi injectate aici -->
    </div>

    <script>
        // AICI PUI SCRIPTURILE TALE
        const scripts = [
            {
                name: "UNIVhub",
                game: "Universal",
                tags: ["Premium", "Mobile Friendly", "Aimbot", "ESP"],
                views: "1.2K",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/filip-prog/HussHubV2/main/UNIVhub.lua"))()'
            },
            {
                name: "PrimeHUB",
                game: "Prison Life",
                tags: ["Key System", "Mobile Friendly", "Silent Aim"],
                views: "3.4K",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/filip-prog/fuzzy-octo-train/main/main.lua"))()'
            },
            {
                name: "MoneyHUB",
                game: "Steal An Egg",
                tags: ["Mobile Friendly", "Pet Spawner"],
                views: "5.1K",
                code: 'loadstring(game:HttpGet("https://raw.githubusercontent.com/filip-prog/Steal-a-egg/main/main.lua"))()'
            }
        ];

        const container = document.getElementById('scripts-container');

        scripts.forEach((script, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            
            let tagsHTML = '';
            script.tags.forEach(tag => {
                let tagClass = 'tag';
                if (tag === 'Key System') tagClass += ' key';
                if (tag === 'Mobile Friendly') tagClass += ' mobile';
                if (tag === 'Premium') tagClass += ' premium';
                tagsHTML += `<span class="${tagClass}">${tag}</span>`;
            });

            card.innerHTML = `
                <div class="card-header">
                    ${tagsHTML}
                </div>
                <h3>
                    <span>${script.game}</span>
                    ${script.name}
                </h3>
                <div class="card-footer">
                    <div class="views">👁️ ${script.views} views</div>
                    <button class="copy-btn" id="btn-${index}">📋 Copy Script</button>
                </div>
            `;

            container.appendChild(card);

            const btn = document.getElementById(`btn-${index}`);
            btn.addEventListener('click', () => {
                navigator.clipboard.writeText(script.code).then(() => {
                    btn.textContent = "✅ Copied!";
                    btn.classList.add('success');
                    setTimeout(() => {
                        btn.textContent = "📋 Copy Script";
                        btn.classList.remove('success');
                    }, 2000);
                });
            });
        });
    </script>
</body>
</html>
